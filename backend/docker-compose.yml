# Local development stack:  docker compose -f backend/docker-compose.yml up --build
# Postgres here is a stand-in for Supabase (auth/storage schemas are stubbed); mint test tokens with scripts/dev_token.py
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: fxzone }
    volumes:
      - ..:/repo:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d fxzone"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  api:
    build: .
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fxzone
      REDIS_URL: redis://redis:6379/0
      SUPABASE_JWT_SECRET: dev-only-secret-change-me-32-characters-min
      STORAGE_BACKEND: local
      PUBLIC_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
      WEB_CONCURRENCY: "1"
