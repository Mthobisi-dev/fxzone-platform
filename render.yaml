services:
  - type: web
    name: fxzone-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fxzone-postgres
          property: connectionString
      - key: RENDER_EXTERNAL_URL
        value: https://fxzone-backend.onrender.com
      - key: SECRET_KEY
        value: fxzone-production-secure-key-2026-auth-jwt
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","https://fxzone-platform-4dqe.vercel.app","https://fxzone-platform.vercel.app"]'
      - key: ALPHA_VANTAGE_KEY
        value: QH4RURKPH3A8S2MX
      - key: FRED_API_KEY
        value: b6fb9b5c82d9ab687d281dcad40e377c
      - key: FMP_API_KEY
        value: pOXbkN6XSF1MeruhUROz3pZIxWwOLpWk

databases:
  - name: fxzone-postgres
    databaseName: fxzone_db
    user: fxzone_admin
    plan: free
    ipAllowList: []
